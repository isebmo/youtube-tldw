<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube TLDW; — Résumé</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            max-width: 480px;
            margin: 60px auto;
            padding: 24px;
            background: #f5f5f7;
            color: #1c1c1e;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #000; color: #fff; }
        }
        .logo {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin: 0 auto 24px;
            background: #ff0033;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 28px;
        }
        h1 { font-size: 24px; margin: 0 0 8px; }
        p { color: #6e6e73; margin: 0 0 28px; }
        .cta {
            display: inline-block;
            background: #ff0033;
            color: #fff;
            padding: 14px 26px;
            border-radius: 14px;
            font-weight: 600;
            text-decoration: none;
            font-size: 16px;
        }
        .small { color: #98989d; font-size: 13px; margin-top: 32px; }
    </style>
</head>
<body>
    <div class="logo">TLDW;</div>
    <h1>Ouvre YouTube TLDW;</h1>
    <p id="msg">Cette page se ferme dès que l'app est lancée.</p>
    <a href="#" id="open-app" class="cta">Ouvrir l'app</a>
    <p class="small">Si tu n'as pas l'app installée, télécharge-la depuis l'App Store.</p>
    <script>
        // The Universal Link should redirect to the app automatically.
        // This page is only shown when the app isn't installed (fallback).
        const params = new URLSearchParams(location.search);
        const url = params.get('url');
        const link = document.getElementById('open-app');
        link.href = 'tldw://summarize?url=' + encodeURIComponent(url || '');
    </script>
</body>
</html>
